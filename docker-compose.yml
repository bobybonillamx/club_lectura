services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clublectura}
      POSTGRES_USER: ${POSTGRES_USER:-clublectura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clublectura}
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8787}:${APP_INTERNAL_PORT:-8787}"
    depends_on:
      - db
    environment:
      APP_INTERNAL_PORT: ${APP_INTERNAL_PORT:-8787}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-clublectura}
      POSTGRES_USER: ${POSTGRES_USER:-clublectura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clublectura}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}

volumes:
  pg_data:

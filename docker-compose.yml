version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clublectura
      POSTGRES_USER: clublectura
      POSTGRES_PASSWORD: clublectura
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: clublectura
      POSTGRES_USER: clublectura
      POSTGRES_PASSWORD: clublectura
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "false"
      DJANGO_SECRET_KEY: change-me
      PUBLIC_BASE_URL: http://localhost:8000

volumes:
  pg_data:
